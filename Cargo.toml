# SPDX-License-Identifier: MIT
[package]
name = "vamender"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
description = "Backup-first VAR repair, dependency cleanup, and version management for Virt-a-Mate"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheAgenticCreator/vamender"
homepage = "https://github.com/TheAgenticCreator/vamender"
keywords = ["virt-a-mate", "vam", "var", "mod-manager", "backup"]
categories = ["command-line-utilities", "filesystem"]

[package.metadata.winresource]
OriginalFilename = "vamender.exe"
LegalCopyright = "Copyright (c) 2026 VaMender contributors"

[[bin]]
name = "vamender"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "xz"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"
