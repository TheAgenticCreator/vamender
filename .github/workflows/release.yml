# SPDX-License-Identifier: MIT
name: Release

env:
  RELEASE_CHANNEL: beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check pseudonymous maintainer history and tag
        shell: pwsh
        run: >-
          ./tools/check-maintainer-identity.ps1
          -Revision HEAD
          -Tag $env:GITHUB_REF_NAME
      - name: Install build toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install plugin validation SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Validate version and changelog
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == "beta" && ! "$GITHUB_REF_NAME" =~ ^v0\. ]]; then
            echo "::error::Beta channel releases require a 0.x.y version"
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          installer_version="$(sed -n 's/^#define MyAppVersion "\([^"]*\)"/\1/p' installer/VaMender.iss | head -n 1)"
          plugin_version="$(sed -n 's/^[[:space:]]*private const string Version = "\([^"]*\)";/\1/p' vam-plugin/Custom/Scripts/AgenticCreator/VaMender/src/VaMender.cs | head -n 1)"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
          if [[ "$tag_version" != "$installer_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match installer version $installer_version"
            exit 1
          fi
          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $plugin_version"
            exit 1
          fi
          if ! grep -Fq "## [$package_version] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated [$package_version] release section"
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Check SPDX identifiers
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            if head -n 3 "$file" | grep -Fq "SPDX-License-Identifier: MIT"; then
              continue
            fi
            if [[ -f "$file.license" ]] &&
               grep -Fq "SPDX-License-Identifier: MIT" "$file.license"; then
              continue
            fi
            echo "::error file=$file::Missing SPDX-License-Identifier: MIT"
            failed=1
          done < <(git ls-files)
          exit "$failed"
      - name: Lint
        run: >-
          cargo clippy --all-targets --all-features --locked --
          -D warnings
          -D clippy::cognitive_complexity
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Restore native VaM plugin validation
        run: >-
          dotnet restore vam-plugin/test/VaMender.Plugin.Validation.csproj
          --configfile vam-plugin/test/NuGet.config
      - name: Compile native VaM plugin against API stubs
        run: >-
          dotnet build vam-plugin/test/VaMender.Plugin.Validation.csproj
          --configuration Release
          --no-restore
      - name: Stamp the validated CLR 2 plugin baseline
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          ./tools/stamp-vam-plugin-release.ps1 `
            -Version $version `
            -OutputPath ./target/stamped-plugin/VaMender.dll
          Copy-Item `
            ./target/stamped-plugin/VaMender.dll `
            ./vam-plugin/Custom/Scripts/AgenticCreator/VaMender/VaMender.dll `
            -Force
      - name: Validate VaM plugin security metadata
        run: >-
          dotnet run
          --project vam-plugin/test/VaMender.Plugin.Validation.csproj
          --configuration Release
          --no-build
          --
          vam-plugin/Custom/Scripts/AgenticCreator/VaMender/VaMender.dll
      - name: Build and validate Hub VAR
        shell: pwsh
        run: >-
          ./tools/package-vam-plugin.ps1
          -OutputPath ./target/AgenticCreator.VaMender.2.var

  windows:
    name: Windows beta artifacts
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check pseudonymous maintainer history and tag
        shell: pwsh
        run: >-
          ./tools/check-maintainer-identity.ps1
          -Revision HEAD
          -Tag $env:GITHUB_REF_NAME
      - name: Stamp the validated CLR 2 plugin baseline
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart([char]"v")
          ./tools/stamp-vam-plugin-release.ps1 `
            -Version $version `
            -OutputPath ./target/stamped-plugin/VaMender.dll
          Copy-Item `
            ./target/stamped-plugin/VaMender.dll `
            ./vam-plugin/Custom/Scripts/AgenticCreator/VaMender/VaMender.dll `
            -Force
      - name: Install build toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Build
        run: cargo build --release --locked
      - name: Build Hub VAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          ./tools/package-vam-plugin.ps1 -OutputPath ./dist/AgenticCreator.VaMender.2.var
          $hash = (Get-FileHash `
            ./dist/AgenticCreator.VaMender.2.var `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgenticCreator.VaMender.2.var" |
            Set-Content ./dist/AgenticCreator.VaMender.2.var.sha256
      - name: Verify executable branding
        shell: pwsh
        run: |
          $exe = (Resolve-Path target\release\vamender.exe).Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "VaMender") {
            throw "Unexpected ProductName: $($info.ProductName)"
          }
          if ($info.OriginalFilename -ne "vamender.exe") {
            throw "Unexpected OriginalFilename: $($info.OriginalFilename)"
          }
          $expectedVersion = "${{ github.ref_name }}".TrimStart([char]"v")
          if ($info.ProductVersion -ne $expectedVersion) {
            throw "ProductVersion $($info.ProductVersion) does not match $expectedVersion"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) {
            throw "The release executable has no associated icon"
          }
          $icon.Dispose()
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build one-click Windows setup
        shell: pwsh
        run: |
          iscc.exe .\installer\VaMender.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = Get-Item .\dist\VaMender-Setup-*.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256"
      - name: Package portable CLI
        shell: pwsh
        run: |
          $portable = New-Item -ItemType Directory -Path portable
          Copy-Item target\release\vamender.exe $portable
          Copy-Item cleanup.ps1, comprehensive-cleanup.ps1 $portable
          Copy-Item README.md, CHANGELOG.md, LICENSE, DISCLAIMER.md $portable
          Copy-Item assets\vamender-icon.png, assets\vamender-hub-icon-100.png $portable
          Compress-Archive -Path portable\* -DestinationPath vamender-windows-x64.zip
          $hash = (Get-FileHash vamender-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  vamender-windows-x64.zip" | Set-Content vamender-windows-x64.zip.sha256
      - name: Upload tagged release bundle to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vamender-${{ github.ref_name }}
          path: |
            target/release/vamender.exe
            dist/AgenticCreator.VaMender.2.var
            dist/AgenticCreator.VaMender.2.var.sha256
            dist/VaMender-Setup-*.exe
            dist/VaMender-Setup-*.exe.sha256
            vamender-windows-x64.zip
            vamender-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Create GitHub beta release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-Item .\dist\VaMender-Setup-*.exe
          $assets = @(
            "vamender-windows-x64.zip"
            "vamender-windows-x64.zip.sha256"
            "dist/AgenticCreator.VaMender.2.var"
            "dist/AgenticCreator.VaMender.2.var.sha256"
            $setup.FullName
            "$($setup.FullName).sha256"
          )
          gh release create "${{ github.ref_name }}" @assets `
            --verify-tag `
            --generate-notes `
            --prerelease `
            --title "VaMender ${{ github.ref_name }} (beta)"
