# SPDX-License-Identifier: MIT
name: Feature request
description: Propose a focused, backup-safe improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        VaMender fails closed when a change cannot be proved safe. Proposals that
        weaken backups, licensing safeguards, or strict script/plugin references
        need a compelling and testable safety model.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What common VAR-management problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful command or behavior change.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Backup, restore, and compatibility considerations
      description: How can the tool prove the action safe and reverse it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
