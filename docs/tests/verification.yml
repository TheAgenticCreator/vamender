# SPDX-License-Identifier: MIT
# Canonical one-to-one Specsmith evidence mappings for VaMender.

- id: TEST-001
  title: Product identity and beta-language review
  requirement_id: REQ-001
  type: manual
  verification_method: Review UI, README, installer, package metadata, changelog, and release output for canonical VaMender naming and explicit beta posture.

- id: TEST-002
  title: Supported Windows and VaM compatibility
  requirement_id: REQ-002
  type: e2e
  verification_method: Build on Windows, install without elevation, and load the CLR 2 plugin in VaM 1.22.0.12 as a standard user.

- id: TEST-003
  title: Read-only package inventory
  requirement_id: REQ-003
  type: e2e
  verification_method: Run check and check --deep on a disposable representative library and verify no package bytes or paths change.

- id: TEST-004
  title: VaM-aware planning
  requirement_id: REQ-004
  type: integration
  verification_method: Run planning with fresh, stale, and absent VaM logs and verify runtime-confirmed language appears only with fresh matching evidence.

- id: TEST-005
  title: Metadata repair integration
  requirement_id: REQ-005
  type: integration
  verification_method: Run the metadata reconstruction and false-label Rust tests, including explicit-license and unknown-license behavior.

- id: TEST-006
  title: Filename and archive repair integration
  requirement_id: REQ-006
  type: integration
  verification_method: Run both filename repair Rust tests plus supported archive-header validation with verified backup evidence.

- id: TEST-007
  title: Safe relink integration
  requirement_id: REQ-007
  type: integration
  verification_method: Run exact-reference fallback and dependency-closure tests and verify plugin references stay exact while safe non-plugin references relink.

- id: TEST-008
  title: Dependency-closure and missing-member diagnosis
  requirement_id: REQ-008
  type: integration
  verification_method: Run dependency-closure, missing-provider-member, and VaM missing-clothing warning Rust tests.

- id: TEST-009
  title: Conservative migration integration
  requirement_id: REQ-009
  type: integration
  verification_method: Run migration rewrite/archive and metadata payload-conflict Rust tests and confirm unsafe candidates remain installed.

- id: TEST-010
  title: Verified whole-VAR backup
  requirement_id: REQ-010
  type: integration
  verification_method: Run applied repair/migration tests and verify source checksum, backup checksum, and manifest record precede live mutation.

- id: TEST-011
  title: Atomic rewrite and post-validation
  requirement_id: REQ-011
  type: integration
  verification_method: Run applied rewrite tests and verify only a validated temporary archive reaches the destination and post-change checks pass.

- id: TEST-012
  title: Checksum and containment restore
  requirement_id: REQ-012
  type: integration
  verification_method: Exercise normal, recent-subset, overwrite-conflict, checksum-failure, and traversal-rejection restore paths on a disposable root.

- id: TEST-013
  title: Predictable report handoff
  requirement_id: REQ-013
  type: integration
  verification_method: Run every public command and verify the three top-level report files plus full-run _details evidence and deterministic unresolved IDs.

- id: TEST-014
  title: CLI mutation gate behavior
  requirement_id: REQ-014
  type: cli
  verification_method: Verify help safety text, read-only command immutability, dry-run defaults, and rejection of applied operations without a safe backup root.

- id: TEST-015
  title: Bridge allowlist and request validation
  requirement_id: REQ-015
  type: integration
  verification_method: Run bridge ID tests and one-cycle allowlist, root binding, lock, heartbeat, atomic state, and unknown-operation checks.

- id: TEST-016
  title: Plugin sandbox and live workflow
  requirement_id: REQ-016
  type: e2e
  verification_method: Pass C# compile/type-load/security validation, then exercise busy locking, status, successful engine operation, and rescan in VaM 1.22.0.12.

- id: TEST-017
  title: Installer and uninstall lifecycle
  requirement_id: REQ-017
  type: e2e
  verification_method: Pass host-install Rust tests and Setup build, then smoke install, unsafe-path rejection, startup, plugin preservation, uninstall, and retained backups/reports.

- id: TEST-018
  title: Rights, privacy, and no-acquisition review
  requirement_id: REQ-018
  type: manual
  verification_method: Review the release diff and representative execution for content acquisition, authentication bypass, license guessing, telemetry, or restricted plugin APIs.

- id: TEST-019
  title: Package compatibility matrix
  requirement_id: REQ-019
  type: integration
  verification_method: Exercise Unicode, nesting, casing, supported compression, malformed archive, and tar-compatible fallback fixtures without evidence loss.

- id: TEST-020
  title: Complete CI and CodeQL gate
  requirement_id: REQ-020
  type: build
  verification_method: Require green pinned Specsmith audit, format, SPDX, Clippy, Rust tests, C# validation, VAR package, Windows build/branding/Setup, artifact upload, and CodeQL jobs.

- id: TEST-021
  title: Tagged GitHub Actions beta release
  requirement_id: REQ-021
  type: e2e
  verification_method: Push an approved matching v0.MINOR.PATCH tag and verify Actions rejects any baseline DLL or normalized plugin-source hash mismatch, applies only the approved equal-length release stamp, validates the stamped CLR 2 metadata, packages the current integer VAR revision, checksums and retains all artifacts, and creates a GitHub prerelease with every expected asset from that commit.

- id: TEST-022
  title: Disposable-library beta acceptance
  requirement_id: REQ-022
  type: e2e
  verification_method: Record supported-environment install, check, deep check, plan, backed-up mutation, VaM rescan, report review, restore, and uninstall evidence on a disposable representative library.

- id: TEST-023
  title: Documentation consistency review
  requirement_id: REQ-023
  type: manual
  verification_method: Review all user and maintainer documents for naming, beta status, platform, backup warning, rights boundary, limitations, restore guidance, and independent-project disclosure.

- id: TEST-024
  title: Privacy-safe support bundle
  requirement_id: REQ-024
  type: integration
  verification_method: Run support-report fixtures and verify extracted package issues, optional inventory behavior, ZIP output, absence of absolute paths and raw logs, no network transmission, and mandatory review confirmation before GitHub handoff.

- id: TEST-025
  title: VaM Hub draft and package compliance review
  requirement_id: REQ-025
  type: manual
  verification_method: Upload the exact CI VAR to the Hub Health Report, verify only meta.json and the original VaMender DLL are present with CC BY and no dependencies, obtain moderator confirmation for the companion installer/engine model, and review the draft against current official policies before posting.

- id: TEST-026
  title: v1.0.0 promotion gate review
  requirement_id: REQ-026
  type: manual
  verification_method: Require every v1.0.0 gate in docs/ROADMAP.md to have dated evidence, no unresolved release blocker, and explicit maintainer approval before changing the beta channel or publishing a v1.0.0 tag.

- id: TEST-027
  title: Pseudonymous maintainer history gate
  requirement_id: REQ-027
  type: build
  verification_method: Run tools/check-maintainer-identity.ps1 across complete branch history and the annotated release tag, verify a synthetic non-TheAgenticCreator author or committer is rejected, and confirm the public repository event actor is TheAgenticCreatorDev or an approved organization GitHub App before publication.
- id: TEST-028
  title: Windows tray-host lifecycle
  requirement_id: REQ-028
  type: integration
  verification_method: Build and install on Windows x64, verify the notification-area icon and menu actions, confirm Start with Windows registration uses the hidden host command, confirm the bridge stays available while VaM opens and closes, then request Exit during idle and active work and verify cooperative shutdown plus lock cleanup.
